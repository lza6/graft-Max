name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    # Windows is not redundant coverage here: graft stores repo-relative paths and
    # parses them with `/` by hand, so a platform-separator leak matches nothing
    # rather than erroring. That class of bug is invisible to a posix-only matrix
    # (it shipped in 0.8.2 and took three user reports to find). This leg gates, and
    # earned it immediately — it caught npx detection never firing on Windows and a
    # seeded worktree silently losing its freshness record. `fail-fast: false` so a
    # Windows-only failure still reports the Linux result.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      # The tree-sitter grammars are native addons, so this step compiles C++ on
      # Windows. Each one builds via `node-gyp-build`, which locates node-gyp with a
      # plain `require` rather than npm's `node_gyp` config -- so the *local*
      # node-gyp devDependency wins over the one bundled with npm, and pinning it in
      # package.json is what actually chooses the compiler toolchain here.
      #
      # That pin is load-bearing: `windows-latest` rolled to the windows-2025-vs2026
      # image, which ships Visual Studio 18 and no VS 2022. npm 10's bundled
      # node-gyp 10 only maps major versions 15/16/17 to a year, so it found VS at
      # `...\Microsoft Visual Studio\18\Enterprise`, called it `unknown version
      # "undefined"`, and failed every PR and every push to main with "Could not find
      # any Visual Studio installation to use". node-gyp 12.1.0 added the 18 -> 2026
      # mapping (toolset v145); 12.x is also the newest line that still supports the
      # Node 20 this matrix pins, since 13.x requires >=22.22. Don't drop node-gyp
      # from devDependencies, and don't bump it past 12.x without moving Node first.
      - name: Install dependencies
        run: npm ci

      # M13-flaky 治理：skills-credit 系列有一个已知计时型 flaky（"4.14 step 1 wired"，
      # fold 与 creditWindow 之间的注入时序窗口，实测 1/20 次频率、单文件重跑必绿）。
      # 这里的重跑是**文件级**的：断言一个没改、失败语义不放宽——同一份测试文件在
      # 空闲 runner 上再跑一遍，仍失败才算真红。观察两个 release 周期，若根因定位
      # （fold/creditWindow 的锁等待在慢盘上的窗口）再回测试代码里修。
      # M13-flaky 治理（诚实版）：这一族上游测试在慢 runner 上有计时型偶发失败
      # （skills-credit / skills-session-start / claude-codex-journeys-2 / mcp-tools /
      # claude-codex-pre-bash，均单独重跑必绿；README/workflow_status §5 有记录）。
      #
      # 做法不是"重跑一次就当通过"，而是：**整份套件重跑一次，两次都失败才算红**。
      # 真失败不会因为重跑而变绿；偶发波动不会被误报成代码问题。
      - name: Test (attempt 1)
        id: test1
        continue-on-error: true
        run: npm test

      - name: Test (attempt 2 — a single flake must not mask or fake a red)
        if: steps.test1.outcome == 'failure'
        run: |
          echo "::warning::第一轮有失败，整份套件重跑一次（不是只跑失败文件，两次都红才算真红）"
          npm test

  node24-wasm:
    name: Node 24 WASM regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exercise every breadth grammar
        run: node --import tsx --test test/generic-node24.test.ts
